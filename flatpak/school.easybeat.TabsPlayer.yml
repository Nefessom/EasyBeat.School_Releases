app-id: school.easybeat.TabsPlayer
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: easybeat-school
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  # Library: ~/Downloads/Tabs Player (getDefaultTabsStoragePath in electron/main.cjs)
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: easybeat-school
    buildsystem: simple
    build-commands:
      - cp -r app /app/easybeat
      - install -Dm755 easybeat-school.sh /app/bin/easybeat-school
      - install -Dm644 school.easybeat.TabsPlayer.desktop /app/share/applications/school.easybeat.TabsPlayer.desktop
      - install -Dm644 school.easybeat.TabsPlayer.mime.xml /app/share/mime/packages/school.easybeat.TabsPlayer.xml
      - install -Dm644 school.easybeat.TabsPlayer.metainfo.xml /app/share/metainfo/school.easybeat.TabsPlayer.metainfo.xml
      - for s in 64 128 256 512; do install -Dm644 icons/${s}x${s}.png /app/share/icons/hicolor/${s}x${s}/apps/school.easybeat.TabsPlayer.png; done
    sources:
      # Local test build. For Flathub this becomes a public archive URL with sha256.
      - type: dir
        path: ../../EasyBeat.School-0.7.1/release/linux/linux-unpacked
        dest: app
      - type: dir
        path: icons
        dest: icons
      - type: file
        path: easybeat-school.sh
      - type: file
        path: school.easybeat.TabsPlayer.desktop
      - type: file
        path: school.easybeat.TabsPlayer.metainfo.xml
      - type: file
        path: school.easybeat.TabsPlayer.mime.xml
