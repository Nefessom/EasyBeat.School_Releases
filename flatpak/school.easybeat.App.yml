app-id: school.easybeat.App
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: easybeat-school
separate-locales: false
finish-args:
  - --share=ipc
  # Wayland first (touchpad pinch zoom works only there), X11 only on desktops without Wayland.
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  # Library: ~/Downloads/Tabs Player (getDefaultTabsStoragePath in electron/main.cjs)
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: easybeat-school
    buildsystem: simple
    build-commands:
      - cp -r app /app/easybeat
      - install -Dm755 easybeat-school.sh /app/bin/easybeat-school
      - install -Dm644 school.easybeat.App.desktop /app/share/applications/school.easybeat.App.desktop
      - install -Dm644 school.easybeat.App.mime.xml /app/share/mime/packages/school.easybeat.App.xml
      - install -Dm644 school.easybeat.App.metainfo.xml /app/share/metainfo/school.easybeat.App.metainfo.xml
      - for s in 64 128 256 512; do install -Dm644 icons/${s}x${s}.png /app/share/icons/hicolor/${s}x${s}/apps/school.easybeat.App.png; done
    sources:
      # electron-builder "linux-unpacked" of the release, packed as tar.gz (see packaging/), one per processor
      - type: archive
        url: https://github.com/Nefessom/EasyBeat.School_Releases/releases/download/v0.8.4/EasyBeat.School-0.8.4-linux-x86_64.tar.gz
        sha256: aa6161b128c109367f68fc69b5d09f7b0ff76936e51eb01480b010c4330d6b45
        dest: app
        only-arches: [x86_64]
      - type: archive
        url: https://github.com/Nefessom/EasyBeat.School_Releases/releases/download/v0.8.4/EasyBeat.School-0.8.4-linux-arm64.tar.gz
        sha256: 012f4a959ccf32391b532717f0c52b3f58cb77a5b083002a9d512e26f2753a0d
        dest: app
        only-arches: [aarch64]
      - type: dir
        path: icons
        dest: icons
      - type: file
        path: easybeat-school.sh
      - type: file
        path: school.easybeat.App.desktop
      - type: file
        path: school.easybeat.App.metainfo.xml
      - type: file
        path: school.easybeat.App.mime.xml
